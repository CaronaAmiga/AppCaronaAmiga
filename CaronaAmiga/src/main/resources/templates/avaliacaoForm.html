<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Avaliação - Carona Amiga</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

    <!-- Navbar Padrão -->
    <header th:replace="~{baseLayout :: navbar('avaliacoes')}">
        <div class="navbar-inner">
            <a href="/" class="brand-logo"><i class="fa-solid fa-car-side"></i> Carona Amiga</a>
            <nav class="nav-menu">
                <a href="/"><i class="fa-solid fa-house"></i> Início</a>
                <a href="/caronas"><i class="fa-solid fa-car"></i> Caronas</a>
                <a href="/caronas/nova"><i class="fa-solid fa-plus"></i> Oferecer Carona</a>
                <a href="/solicitacoes"><i class="fa-solid fa-inbox"></i> Solicitações</a>
                <a href="/veiculos"><i class="fa-solid fa-car"></i> Veículos</a>
                <a href="/usuarios"><i class="fa-solid fa-users"></i> Usuários</a>
                <a href="/avaliacoes" class="active"><i class="fa-solid fa-star"></i> Avaliações</a>
                <a href="/historico"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</a>
                <a href="/mensagens"><i class="fa-solid fa-comments"></i> Mensagens</a>
            </nav>
        </div>
    </header>

    <main class="container">
        
        <div class="form-container">
            <h2 style="text-align: center; margin-bottom: 24px;"><i class="fa-solid fa-star"></i> Nova Avaliação</h2>

            <form th:action="@{/avaliacoes}" th:object="${avaliacao}" method="POST">
                
                <div class="form-group">
                    <label for="avaliadorId">Quem está avaliando (Você):</label>
                    <select id="avaliadorId" th:field="*{avaliadorId}" required>
                        <option value="">-- Selecione o Avaliador --</option>
                        <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nome} + ' (' + ${u.matricula} + ')'"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="avaliadoId">Aluno a ser avaliado:</label>
                    <select id="avaliadoId" th:field="*{avaliadoId}" required>
                        <option value="">-- Selecione o Aluno --</option>
                        <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nome}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="caronaId">Carona Referente:</label>
                    <select id="caronaId" th:field="*{caronaId}" required>
                        <option value="">-- Selecione a Carona --</option>
                        <option th:each="c : ${caronas}" th:value="${c.id}" th:text="'#' + ${c.id} + ' - ' + ${c.origem} + ' ➔ ' + ${c.destino} + ' (' + ${c.data} + ')'"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nota">Nota de Desempenho (1 a 5 estrelas):</label>
                    <select id="nota" th:field="*{nota}" required>
                        <option value="5">★★★★★ (5 - Excelente)</option>
                        <option value="4">★★★★ (4 - Muito Bom)</option>
                        <option value="3">★★★ (3 - Bom)</option>
                        <option value="2">★★ (2 - Regular)</option>
                        <option value="1">★ (1 - Ruim)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="comentario">Comentário / Feedback:</label>
                    <textarea id="comentario" th:field="*{comentario}" rows="3" placeholder="Conte como foi a viagem..."></textarea>
                </div>

                <div class="btn-group-center" style="margin-top: 25px;">
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-star"></i> Salvar Avaliação</button>
                    <a href="/avaliacoes" class="btn btn-outline">Cancelar</a>
                </div>
            </form>
        </div>

    </main>

    <!-- Rodapé -->
    <footer th:replace="~{baseLayout :: footer}">
        <p>&copy; 2026 Carona Amiga Universitária - Projeto Acadêmico P1</p>
    </footer>

</body>
</html>
