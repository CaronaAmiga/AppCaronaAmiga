<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdicao} ? 'Editar Usuário' : 'Novo Usuário'">Formulário de Usuário</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

    <!-- Navbar Padrão -->
    <header th:replace="~{baseLayout :: navbar('usuarios')}">
        <div class="navbar-inner">
            <a href="/" class="brand-logo"><i class="fa-solid fa-car-side"></i> Carona Amiga</a>
            <nav class="nav-menu">
                <a href="/"><i class="fa-solid fa-house"></i> Início</a>
                <a href="/caronas"><i class="fa-solid fa-car"></i> Caronas</a>
                <a href="/caronas/nova"><i class="fa-solid fa-plus"></i> Oferecer Carona</a>
                <a href="/solicitacoes"><i class="fa-solid fa-inbox"></i> Solicitações</a>
                <a href="/veiculos"><i class="fa-solid fa-car"></i> Veículos</a>
                <a href="/usuarios" class="active"><i class="fa-solid fa-users"></i> Usuários</a>
                <a href="/avaliacoes"><i class="fa-solid fa-star"></i> Avaliações</a>
                <a href="/historico"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</a>
                <a href="/mensagens"><i class="fa-solid fa-comments"></i> Mensagens</a>
            </nav>
        </div>
    </header>

    <main class="container">
        
        <div class="form-container">
            <h2 style="text-align: center; margin-bottom: 24px;">
                <i th:class="${isEdicao} ? 'fa-solid fa-pen-to-square' : 'fa-solid fa-user-plus'"></i>
                <span th:text="${isEdicao} ? 'Editar Usuário' : 'Novo Aluno / Usuário'">Novo Usuário</span>
            </h2>

            <form th:action="${isEdicao} ? @{/usuarios/{id}/editar(id=${usuarioId})} : @{/usuarios}" 
                  th:object="${usuario}" 
                  method="POST">
                
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" th:field="*{nome}" required placeholder="Ex: Carlos Silva" />
                </div>
                
                <div class="form-group">
                    <label for="emailInstitucional">E-mail Institucional (@iff.edu.br):</label>
                    <input type="email" id="emailInstitucional" th:field="*{emailInstitucional}" required placeholder="exemplo@gsuite.iff.edu.br" />
                </div>

                <div class="form-group">
                    <label for="senha">Senha de Acesso:</label>
                    <input type="password" id="senha" th:field="*{senha}" placeholder="Digite sua senha..." />
                </div>

                <div class="form-group">
                    <label for="matricula">Matrícula Acadêmica:</label>
                    <input type="text" id="matricula" th:field="*{matricula}" required placeholder="Ex: 202411567898" />
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone / WhatsApp:</label>
                    <input type="text" id="telefone" th:field="*{telefone}" required placeholder="Ex: (22) 99999-1111" />
                </div>

                <div class="form-group">
                    <label for="perfilAtivo">Perfil Inicial:</label>
                    <select id="perfilAtivo" th:field="*{perfilAtivo}">
                        <option value="PASSAGEIRO">Passageiro (Busca caronas)</option>
                        <option value="MOTORISTA">Motorista (Oferece caronas)</option>
                    </select>
                </div>

                <div class="btn-group-center" style="margin-top: 25px;">
                    <button type="submit" class="btn btn-primary" th:text="${isEdicao} ? 'Salvar Alterações' : 'Cadastrar Aluno'">Salvar</button>
                    <a href="/usuarios" class="btn btn-outline">Cancelar</a>
                </div>
            </form>
        </div>

    </main>

    <!-- Rodapé -->
    <footer th:replace="~{baseLayout :: footer}">
        <p>&copy; 2026 Carona Amiga Universitária - Projeto Acadêmico P1</p>
    </footer>

</body>
</html>
