<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdicao} ? 'Editar Veículo' : 'Novo Veículo'">Formulário de Veículo</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

    <!-- Navbar Padrão -->
    <header th:replace="~{baseLayout :: navbar('veiculos')}">
        <div class="navbar-inner">
            <a href="/" class="brand-logo"><i class="fa-solid fa-car-side"></i> Carona Amiga</a>
            <nav class="nav-menu">
                <a href="/"><i class="fa-solid fa-house"></i> Início</a>
                <a href="/caronas"><i class="fa-solid fa-car"></i> Caronas</a>
                <a href="/caronas/nova"><i class="fa-solid fa-plus"></i> Oferecer Carona</a>
                <a href="/solicitacoes"><i class="fa-solid fa-inbox"></i> Solicitações</a>
                <a href="/veiculos" class="active"><i class="fa-solid fa-car"></i> Veículos</a>
                <a href="/usuarios"><i class="fa-solid fa-users"></i> Usuários</a>
                <a href="/avaliacoes"><i class="fa-solid fa-star"></i> Avaliações</a>
                <a href="/historico"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</a>
                <a href="/mensagens"><i class="fa-solid fa-comments"></i> Mensagens</a>
            </nav>
        </div>
    </header>

    <main class="container">
        
        <div class="form-container">
            <h2 style="text-align: center; margin-bottom: 24px;">
                <i th:class="${isEdicao} ? 'fa-solid fa-pen-to-square' : 'fa-solid fa-plus'"></i>
                <span th:text="${isEdicao} ? 'Editar Veículo' : 'Novo Veículo'">Novo Veículo</span>
            </h2>

            <form th:action="${isEdicao} ? @{/veiculos/{id}/editar(id=${veiculoId})} : @{/veiculos}" 
                  th:object="${veiculo}" 
                  method="POST">
                
                <div class="form-group">
                    <label for="modelo">Modelo do Veículo:</label>
                    <input type="text" id="modelo" th:field="*{modelo}" required placeholder="Ex: Fiat Uno, Chevrolet Onix..." />
                </div>
                
                <div class="form-group">
                    <label for="cor">Cor do Carro:</label>
                    <input type="text" id="cor" th:field="*{cor}" required placeholder="Ex: Prata, Branco, Preto..." />
                </div>

                <div class="form-group">
                    <label for="placa">Placa do Veículo:</label>
                    <input type="text" id="placa" th:field="*{placa}" required placeholder="Ex: ABC-1234 ou ABC1D23" />
                </div>

                <div class="form-group">
                    <label for="quantidadeVagas">Quantidade de Vagas Disponíveis:</label>
                    <input type="number" id="quantidadeVagas" th:field="*{quantidadeVagas}" min="1" max="8" required placeholder="Ex: 4" />
                </div>

                <div class="form-group">
                    <label for="motoristaId">Motorista Proprietário:</label>
                    <select id="motoristaId" th:field="*{motoristaId}" required>
                        <option value="">-- Selecione o Aluno Motorista --</option>
                        <option th:each="user : ${usuarios}" 
                                th:value="${user.id}" 
                                th:text="${user.nome} + ' (' + ${user.matricula} + ')'">
                            Carlos Silva
                        </option>
                    </select>
                </div>

                <div class="btn-group-center" style="margin-top: 25px;">
                    <button type="submit" class="btn btn-primary" th:text="${isEdicao} ? 'Salvar Alterações' : 'Cadastrar Veículo'">Salvar</button>
                    <a href="/veiculos" class="btn btn-outline">Cancelar</a>
                </div>
            </form>
        </div>

    </main>

    <!-- Rodapé -->
    <footer th:replace="~{baseLayout :: footer}">
        <p>&copy; 2026 Carona Amiga Universitária - Projeto Acadêmico P1</p>
    </footer>

</body>
</html>
