<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Erro Interno | Carona Amiga</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Navbar Padrão -->
    <header th:replace="~{baseLayout :: navbar('')}">
        <div class="navbar-inner">
            <a href="/" class="brand-logo"><i class="fa-solid fa-car-side"></i> Carona Amiga</a>
        </div>
    </header>

    <main class="container" style="max-width: 600px; text-align: center; padding-top: 60px;">
        <div class="card" style="padding: 40px; box-shadow: var(--shadow-lg);">
            <div style="margin-bottom: 20px;">
                <i class="fa-solid fa-triangle-exclamation" style="font-size: 4rem; color: var(--danger);"></i>
            </div>

            <span class="badge badge-danger" style="font-size: 0.9rem; padding: 4px 14px; margin-bottom: 12px; display: inline-block;">
                Erro 500 - Servidor
            </span>

            <h2 style="margin-bottom: 12px; color: var(--neutral-dark);" th:text="${titulo} ?: 'Erro Interno'">Erro Interno no Servidor</h2>
            
            <p style="color: var(--neutral); font-size: 1.05rem; margin-bottom: 18px;" th:text="${mensagem} ?: 'Ocorreu um problema ao processar sua requisição.'">
                Ocorreu um problema inesperado ao processar sua requisição.
            </p>

            <div th:if="${detalhe != null}" style="background-color: var(--danger-bg); color: var(--danger); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 20px; font-size: 0.85rem; word-break: break-all;" th:text="${detalhe}">
                Detalhe técnico do erro.
            </div>

            <div class="btn-group-center" style="gap: 12px;">
                <a href="/" class="btn btn-primary"><i class="fa-solid fa-house"></i> Voltar ao Início</a>
                <a href="javascript:history.back()" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Tentar Novamente</a>
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer th:replace="~{baseLayout :: footer}">
        <p>&copy; 2026 Carona Amiga Universitária - Projeto Acadêmico P1</p>
    </footer>

</body>
</html>
